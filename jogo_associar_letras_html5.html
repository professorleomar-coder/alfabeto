<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo: Maiúsculas e Minúsculas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #23395b 0%, #0d1b2a 45%, #08111d 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 18px;
      overflow-x: hidden;
    }
    .game {
      width: min(1200px, 100%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(212,175,55,0.45);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 0 30px rgba(0,0,0,0.35), inset 0 0 20px rgba(212,175,55,0.08);
    }
    header { text-align: center; margin-bottom: 12px; }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.35rem, 3.8vw, 2.4rem);
      color: #f4d36b;
      text-shadow: 0 0 14px rgba(212,175,55,0.45);
      font-weight: 900;
    }
    .instructions {
      margin: 0 auto 14px;
      max-width: 820px;
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      line-height: 1.35;
      color: #f4f7fb;
      font-weight: 700;
    }
    .topbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .status, .message {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      font-weight: 900;
      font-size: 1rem;
    }
    .status strong { color: #f4d36b; margin-left: 6px; }
    .message { color: #fff; min-width: min(520px,100%); }
    .message.ok { background: rgba(40, 167, 69, 0.28); }
    .message.err { background: rgba(220, 53, 69, 0.32); }
    .message.win { background: rgba(212,175,55,0.28); color: #fff8d9; }
    button {
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 900;
      color: #0d1b2a;
      background: linear-gradient(135deg, #f7dc7a, #d4af37);
      box-shadow: 0 8px 18px rgba(0,0,0,0.28), 0 0 14px rgba(212,175,55,0.35);
      transition: transform .15s ease, filter .15s ease;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .panel {
      padding: 14px;
      border-radius: 20px;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.13);
    }
    .panel h2 {
      margin: 0 0 12px;
      text-align: center;
      color: #f4d36b;
      font-size: 1.05rem;
      letter-spacing: .5px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(74px, 1fr));
      gap: 12px;
      align-items: center;
    }
    .card {
      aspect-ratio: 1 / 1;
      min-height: 74px;
      padding: 8px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.93);
      border: 3px solid transparent;
      box-shadow: 0 6px 14px rgba(0,0,0,0.28);
      transition: transform .15s ease, border-color .15s ease, opacity .25s ease;
      user-select: none;
    }
    .card:hover { transform: scale(1.04); }
    .card.selected {
      border-color: #d4af37;
      box-shadow: 0 0 18px rgba(212,175,55,0.8), 0 6px 14px rgba(0,0,0,0.28);
    }
    .card.wrong {
      animation: shake .25s ease;
      border-color: #ff4d4d;
    }
    .card img {
      max-width: 92%;
      max-height: 92%;
      display: block;
      pointer-events: none;
    }
    .card.hidden {
      opacity: 0;
      transform: scale(.2);
      pointer-events: none;
      visibility: hidden;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    @media (max-width: 760px) {
      body { padding: 10px; }
      .game { padding: 12px; border-radius: 18px; }
      .boards { grid-template-columns: 1fr; gap: 12px; }
      .grid { grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 9px; }
      .card { min-height: 58px; border-radius: 14px; padding: 6px; }
      .panel { padding: 10px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <h1>ASSOCIE AS LETRAS </h1>
      <p class="instructions">Clique na letra <b>maiúscula</b> e depois na letra <b>minúscula</b> correspondente, seguindo a ordem alfabética.</p>
    </header>
    <section class="topbar">
      <div class="status">Próxima associação: <strong id="target">A / a</strong></div>
      <div class="message" id="message">Comece associando A com a.</div>
      <button id="restart">Jogar novamente</button>
    </section>
    <section class="boards">
      <div class="panel">
        <h2>Letras Maiúsculas</h2>
        <div class="grid" id="upperGrid"></div>
      </div>
      <div class="panel">
        <h2>Letras Minúsculas</h2>
        <div class="grid" id="lowerGrid"></div>
      </div>
    </section>
  </main>

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];

      return copy;
    }

      const img = document.createElement('img');
      img.src = item.src;
      img.alt = type === 'upper' ? item.letter : item.letter.toLowerCase();
      card.appendChild(img);

      card.addEventListener('click', () => handleClick(card));
      return card;
    }

    function render() {
      upperGrid.innerHTML = '';
      lowerGrid.innerHTML = '';
      shuffle(upperImages).forEach(item => upperGrid.appendChild(createCard(item, 'upper')));
      shuffle(lowerImages).forEach(item => lowerGrid.appendChild(createCard(item, 'lower')));
      currentIndex = 0;
      selected = null;
      setMessage('Comece associando A com a.');
      updateTarget();
    }

    function markWrong(card, text) {
      card.classList.add('wrong');
      setMessage(text, 'err');
      setTimeout(() => card.classList.remove('wrong'), 300);
    }

    function clearSelected() {
      document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
      selected = null;
    }

    function handleClick(card) {
      if (currentIndex >= alphabet.length || card.classList.contains('hidden')) return;

      const expected = alphabet[currentIndex];
      const clickedLetter = card.dataset.letter;
      const clickedType = card.dataset.type;

      if (clickedLetter !== expected) {
        markWrong(card, `Agora é a vez de associar ${expected} com ${expected.toLowerCase()}.`);
        clearSelected();
        return;
      }

      if (!selected) {
        selected = card;
        card.classList.add('selected');
        setMessage(`Ótimo! Agora clique na outra forma da letra ${expected}.`);
        return;
      }

      if (selected === card) {
        markWrong(card, 'Você precisa clicar na outra letra correspondente.');
        return;
      }

      if (selected.dataset.type === clickedType) {
        markWrong(card, 'Escolha uma letra maiúscula e uma minúscula, formando o par correto.');
        clearSelected();
        return;
      }

      selected.classList.add('hidden');
      card.classList.add('hidden');
      clearSelected();
      currentIndex++;

      if (currentIndex < alphabet.length) {
        const next = alphabet[currentIndex];
        setMessage(`Correto! Agora associe ${next} com ${next.toLowerCase()}.`, 'ok');
      }
      updateTarget();
    }

    restart.addEventListener('click', render);
    render();
  </script>
</body>
</html>
