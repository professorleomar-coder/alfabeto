const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const gameArea = document.getElementById("gameArea");
const info = document.getElementById("info");

let currentIndex = 0;

function overlap(x, y, positions){
    for(let p of positions){
        if(Math.abs(x-p.x) < 100 && Math.abs(y-p.y) < 100){
            return true;
        }
    }
    return false;
}

const positions = [];

alphabet.forEach(letter => {

    const img = document.createElement("img");
    img.src = images[letter];
    img.className = "letter";
    img.dataset.letter = letter;

    let x, y;
    let tries = 0;

    do {
        x = Math.random() * (window.innerWidth - 120);
        y = Math.random() * (window.innerHeight - 220);
        tries++;
    } while(overlap(x, y, positions) && tries < 500);

    positions.push({x,y});

    img.style.left = x + "px";
    img.style.top = y + "px";

    img.addEventListener("click", () => {

        if(img.dataset.letter === alphabet[currentIndex]) {
            img.remove();
            currentIndex++;

            if(currentIndex < alphabet.length) {
                info.textContent = "Próxima letra: " + alphabet[currentIndex];
            } else {
                info.textContent = "Parabéns! Você completou o alfabeto!";
            }
        }
    });

    gameArea.appendChild(img);
});

</script>
