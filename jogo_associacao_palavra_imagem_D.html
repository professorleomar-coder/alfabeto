<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jogo de Associação - Palavra e Imagem</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #0D1B2A, #102A43 55%, #07111f);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
  }
  .game {
    width: min(1100px, 100%);
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(212,175,55,0.55);
    border-radius: 26px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  h1 {
    margin: 0 0 8px;
    text-align: center;
    color: #D4AF37;
    font-size: clamp(26px, 4vw, 42px);
    font-weight: 900;
    letter-spacing: .5px;
  }
  .subtitle {
    text-align: center;
    margin: 0 0 18px;
    font-size: clamp(16px, 2.4vw, 22px);
    font-weight: 800;
  }
  .panel {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
    align-items: center;
  }
  .word-box {
    background: rgba(255,255,255,0.96);
    border: 4px solid #D4AF37;
    border-radius: 22px;
    padding: 16px;
    min-height: 115px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 10px 28px rgba(212,175,55,0.25);
  }
  .word-box img {
    max-width: min(420px, 90%);
    max-height: 95px;
    object-fit: contain;
  }
  .status {
    text-align:center;
    min-height: 34px;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
  }
  .images {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 18px;
  }
  .card {
    border: 4px solid rgba(255,255,255,0.92);
    border-radius: 22px;
    background: #fff;
    height: 165px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding: 10px;
    box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    transition: transform .18s ease, border-color .18s ease, opacity .25s ease;
  }
  .card:hover { transform: translateY(-4px) scale(1.02); border-color:#D4AF37; }
  .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .card.correct { opacity: 0; transform: scale(.6); pointer-events:none; }
  .card.wrong { animation: shake .35s; border-color: #ff4b4b; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .actions { display:flex; justify-content:center; margin-top:20px; }
  button {
    border: none;
    border-radius: 999px;
    padding: 15px 30px;
    font-size: 19px;
    font-weight: 900;
    background: linear-gradient(135deg, #D4AF37, #ffdf70);
    color: #0D1B2A;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(212,175,55,.35);
  }
  button:hover { transform: translateY(-2px); }
  .progress { text-align:center; margin-top:12px; font-weight:800; color:#f3e6b3; }
  @media (max-width: 520px) {
    .game { padding: 16px; border-radius: 20px; }
    .images { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { height: 135px; }
    .word-box { min-height: 95px; }
  }
</style>
</head>
<body>
  <main class="game">
    <h1>Associe a Palavra à Imagem</h1>
    <p class="subtitle">Clique na imagem que corresponde à palavra apresentada.</p>
    <section class="panel">
      <div class="word-box"><img id="wordImage" alt="Palavra do desafio"></div>
      <div id="status" class="status"></div>
      <div id="images" class="images"></div>
    </section>
    <div class="progress" id="progress"></div>
    <div class="actions"><button onclick="restartGame()">Jogar novamente</button></div>
  </main>

let remaining = [];
let current = null;
let score = 0;
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function restartGame() {
  remaining = shuffle(items);
  score = 0;
  document.getElementById('status').textContent = '';
  renderImages();
  nextQuestion();
}
function renderImages() {
  const container = document.getElementById('images');
  container.innerHTML = '';
  shuffle(items).forEach(item => {
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.id = item.id;
    div.onclick = () => chooseImage(div, item.id);
    const img = document.createElement('img');
    img.src = item.image;
    img.alt = 'Imagem para associação';
    div.appendChild(img);
    container.appendChild(div);
  });
}
function nextQuestion() {
  if (remaining.length === 0) {
    document.getElementById('wordImage').style.display = 'none';
    document.getElementById('status').textContent = 'Parabéns! Você concluiu o jogo!';
    document.getElementById('progress').textContent = `Acertos: ${score} de ${items.length}`;
    return;
  }
  current = remaining[0];
  const word = document.getElementById('wordImage');
  word.style.display = 'block';
  word.src = current.word;
  document.getElementById('status').textContent = '';
  document.getElementById('progress').textContent = `Faltam ${remaining.length} associação(ões).`;
}
function chooseImage(card, id) {
  if (!current) return;
  if (id === current.id) {
    card.classList.add('correct');
    score++;
    remaining.shift();
    document.getElementById('status').textContent = 'Muito bem!';
    setTimeout(nextQuestion, 550);
  } else {
    document.getElementById('status').textContent = 'Tente outra imagem.';
    card.classList.add('wrong');
    setTimeout(() => card.classList.remove('wrong'), 400);
  }
}
restartGame();
</script>
