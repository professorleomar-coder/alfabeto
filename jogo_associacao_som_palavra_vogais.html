<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jogo de Associação: Palavra e Som</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #e8f7ff, #fff4f4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    color: #1f2937;
  }
  .game {
    width: min(1100px, 100%);
    background: rgba(255,255,255,.94);
    border-radius: 28px;
    box-shadow: 0 16px 50px rgba(0,0,0,.16);
    padding: 24px;
    text-align: center;
    border: 6px solid #ffffff;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 5vw, 52px);
    color: #ef4444;
    font-weight: 900;
  }
  .instructions {
    font-size: clamp(17px, 2.4vw, 24px);
    font-weight: 800;
    margin: 0 0 18px;
  }
  .status {
    min-height: 36px;
    font-size: clamp(18px, 2.8vw, 28px);
    font-weight: 900;
    margin: 8px 0 14px;
  }
  .status.ok { color: #16a34a; }
  .status.err { color: #dc2626; }
  .sound-card {
    width: min(360px, 80vw);
    min-height: 170px;
    margin: 0 auto 22px;
    background: #fff;
    border: 5px solid #60a5fa;
    border-radius: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    box-shadow: 0 10px 22px rgba(37,99,235,.18);
  }
  .sound-icon {
    font-size: clamp(48px, 8vw, 82px);
    line-height: 1;
  }
  .listen-btn {
    border: 0;
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, #2563eb, #06b6d4);
    box-shadow: 0 8px 20px rgba(37,99,235,.28);
  }
  .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 18px;
    margin-top: 14px;
  }
  .option {
    border: 5px solid #e5e7eb;
    background: white;
    border-radius: 24px;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    padding: 10px;
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
    box-shadow: 0 8px 18px rgba(0,0,0,.09);
  }
  .option:hover { transform: translateY(-4px) scale(1.02); border-color: #93c5fd; }
  .option:active { transform: scale(.96); }
  .option img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .option.correct { border-color: #22c55e; background: #ecfdf5; transform: scale(.98); }
  .option.wrong { animation: shake .35s ease; border-color: #ef4444; background: #fff1f2; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .controls { margin-top: 22px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    border: 0;
    border-radius: 999px;
    padding: 14px 24px;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, #ef4444, #f97316);
    box-shadow: 0 8px 20px rgba(239,68,68,.28);
  }
  .score { font-size: 20px; font-weight: 900; margin-top: 12px; color: #2563eb; }
  .finish {
    display: none;
    margin: 34px auto 20px;
    padding: 30px 16px;
    font-size: clamp(52px, 10vw, 110px);
    line-height: 1.05;
    font-weight: 1000;
    letter-spacing: 2px;
    color: #ef4444;
    text-shadow: 4px 4px 0 #fde047, 8px 8px 0 #60a5fa, 0 10px 25px rgba(0,0,0,.25);
    animation: pop .7s ease both;
  }
  .finish.show { display: block; }
  @keyframes pop { from { transform: scale(.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <main class="game">
    <div id="playArea">
      <h1>Associe o som à palavra</h1>
      <p class="instructions">Ouça o som e clique na palavra correta.</p>
      <div class="score" id="score">Acertos: 0 de 9</div>
      <div class="status" id="status">Clique em “Ouvir som” para começar!</div>
      <section class="sound-card" aria-label="Som da rodada">
        <div class="sound-icon">🔊</div>
        <button class="listen-btn" id="listenBtn" type="button">Ouvir som</button>
      </section>
      <section class="word-grid" id="wordGrid" aria-label="Opções de palavras"></section>
    </div>
    <div class="finish" id="finishText">FIM DO JOGO</div>
    <div class="controls"><button id="restartBtn" type="button">Jogar novamente</button></div>
  </main>

let sequence = [];
let currentIndex = 0;
let score = 0;
let locked = false;

const scoreEl = document.getElementById('score');
const statusEl = document.getElementById('status');
const wordGrid = document.getElementById('wordGrid');
const listenBtn = document.getElementById('listenBtn');
const restartBtn = document.getElementById('restartBtn');
const finishText = document.getElementById('finishText');
const playArea = document.getElementById('playArea');

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speakCurrent() {
  if (!sequence.length || currentIndex >= sequence.length) return;
  const text = sequence[currentIndex].label;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'pt-BR';
    utter.rate = 0.75;
    utter.pitch = 1.05;
    utter.volume = 1;
    window.speechSynthesis.speak(utter);
  } else {
    statusEl.textContent = 'Seu navegador não reproduz fala automática.';
    statusEl.className = 'status err';
  }
}

function renderOptions() {
  wordGrid.innerHTML = '';
  shuffle(pairs).forEach(pair => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';
    btn.dataset.id = pair.id;
    btn.setAttribute('aria-label', pair.label);
    btn.innerHTML = `<img src="${pair.word}" alt="${pair.label}">`;
    btn.addEventListener('click', () => choose(pair.id, btn));
    wordGrid.appendChild(btn);
  });
}

function showRound() {
  locked = false;
  document.querySelectorAll('.option').forEach(btn => {
    btn.classList.remove('correct', 'wrong');
    btn.disabled = false;
  });
  scoreEl.textContent = `Acertos: ${score} de ${pairs.length}`;
  statusEl.textContent = 'Ouça o som e escolha a palavra correta.';
  statusEl.className = 'status';
}

function choose(id, btn) {
  if (locked || currentIndex >= sequence.length) return;
  const correct = sequence[currentIndex];
  if (id === correct.id) {
    locked = true;
    score++;
    btn.classList.add('correct');
    statusEl.textContent = 'Muito bem!';
    statusEl.className = 'status ok';
    currentIndex++;
    setTimeout(() => {
      if (currentIndex >= sequence.length) finishGame();
      else showRound();
    }, 750);
  } else {
    btn.classList.add('wrong');
    statusEl.textContent = 'Tente novamente!';
    statusEl.className = 'status err';
    setTimeout(() => btn.classList.remove('wrong'), 450);
  }
}

function finishGame() {
  playArea.classList.add('hidden');
  finishText.classList.add('show');
}

function restartGame() {
  sequence = shuffle(pairs);
  currentIndex = 0;
  score = 0;
  locked = false;
  finishText.classList.remove('show');
  playArea.classList.remove('hidden');
  renderOptions();
  showRound();
}

listenBtn.addEventListener('click', speakCurrent);
restartBtn.addEventListener('click', restartGame);
restartGame();
</script>
